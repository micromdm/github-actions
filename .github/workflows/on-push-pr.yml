name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
jobs:
  commit-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - run: shellcheck commit-policy/*.sh

      - run: commit-policy/test.sh

      - uses: ./commit-policy
